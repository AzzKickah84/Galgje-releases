name: Update download counter

on:
  schedule:
    # Refresh a few times per day
    - cron: "0 */6 * * *"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute cumulative installer downloads
        id: stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          releases = json.load(urllib.request.urlopen(req))
          total = 0
          per_release = []
          latest = None
          for rel in releases:
              if rel.get("draft"):
                  continue
              if latest is None and not rel.get("prerelease"):
                  latest = rel.get("tag_name")
              rel_total = 0
              assets = []
              for asset in rel.get("assets", []):
                  if asset.get("name", "").lower().endswith(".exe"):
                      count = int(asset.get("download_count") or 0)
                      rel_total += count
                      assets.append({"name": asset["name"], "download_count": count})
              total += rel_total
              per_release.append({
                  "tag": rel.get("tag_name"),
                  "name": rel.get("name"),
                  "published_at": rel.get("published_at"),
                  "installer_downloads": rel_total,
                  "assets": assets,
              })

          payload = {
              "schemaVersion": 1,
              "repository": repo,
              "totalDownloads": total,
              "latestRelease": latest,
              "lastUpdatedUtc": __import__("datetime").datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "note": "Cumulative installer (.exe) downloads across all GitHub releases. Does not reset on new releases.",
              "perRelease": per_release,
          }
          badge = {
              "schemaVersion": 1,
              "label": "downloads",
              "message": str(total),
              "color": "blue",
          }
          with open("download-stats.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
          with open("download-stats-badge.json", "w", encoding="utf-8") as f:
              json.dump(badge, f, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"total={total}\n")
              out.write(f"latest={latest or ''}\n")
          PY

      - name: Update latest release notes with counter
        if: steps.stats.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TOTAL: ${{ steps.stats.outputs.total }}
          LATEST: ${{ steps.stats.outputs.latest }}
        run: |
          BODY=$(gh release view "$LATEST" --json body -q .body)
          BADGE="![Downloads](https://img.shields.io/badge/downloads-${TOTAL}-blue)"
          HEADER="${BADGE}

          **Total installer downloads (all releases, cumulative):** ${TOTAL}

          "
          BODY=$(printf "%s" "$BODY" | sed -E 's/!\[Downloads\]\(https:\/\/hitscounter\.dev[^)]*\)//')
          if printf "%s" "$BODY" | grep -q "Total installer downloads (all releases, cumulative)"; then
            BODY=$(printf "%s" "$BODY" | sed -E "s/!\[Downloads\]\(https:\/\/img\.shields\.io\/badge\/downloads-[0-9]+-blue\)/${BADGE}/")
            BODY=$(printf "%s" "$BODY" | sed -E "s/\*\*Total installer downloads \(all releases, cumulative\):\*\* [0-9]+/**Total installer downloads (all releases, cumulative):** ${TOTAL}/")
          else
            BODY="${HEADER}${BODY}"
          fi
          printf "%s" "$BODY" > /tmp/release-notes.md
          gh release edit "$LATEST" --notes-file /tmp/release-notes.md

      - name: Commit counter files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-stats.json download-stats-badge.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update cumulative download counter (${{ steps.stats.outputs.total }} total)"
          git push
